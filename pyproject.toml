[project]
name = "catalyst"
license = { text = "GPL-3.0-or-later" }
version = "1.0.0"
description = "High-performance parallel DAG workflow platform: microsecond scheduler, real-time telemetry, visual command center, and CLI."
authors = [    { name = "shenald-dev", email = "bot@shenald.dev" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.1",
    "pydantic>=2.6.3",
]

[project.scripts]
catalyst = "catalyst.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.2",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=4.1.0",
    "mypy>=1.8.0,<2",
    "ruff>=0.3.0",
    "httpx>=0.27.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.mypy]
strict = true

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "vulture>=2.16",
]
